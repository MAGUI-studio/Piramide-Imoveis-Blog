name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build Studio & Web
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: "https://blog.piramideimoveissjc.com.br"
          NEXT_PUBLIC_SANITY_PROJECT_ID: "y2fjdwuo"
          NEXT_PUBLIC_SANITY_DATASET: "production"
          SANITY_STUDIO_PROJECT_ID: "y2fjdwuo"
          SANITY_STUDIO_DATASET: "production"
